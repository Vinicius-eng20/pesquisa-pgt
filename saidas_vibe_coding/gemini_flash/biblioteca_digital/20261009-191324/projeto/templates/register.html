{% extends "base.html" %}

{% block title %}Criar Conta de Leitor - Biblioteca Digital{% endblock %}

{% block content %}
<div class="auth-box">
  <h2>Cadastro de Leitor</h2>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label for="name">Nome Completo:</label>
      <input type="text" id="name" name="name" class="form-control" required autofocus placeholder="Ex: Maria Pereira">
    </div>

    <div class="form-group">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" class="form-control" required placeholder="seu.email@exemplo.com">
    </div>

    <div class="form-group">
      <label for="password">Senha (mínimo 6 caracteres):</label>
      <input type="password" id="password" name="password" class="form-control" minlength="6" required placeholder="Crie uma senha segura">
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirme a Senha:</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="6" required placeholder="Repita a senha">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Criar Minha Conta</button>
  </form>

  <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem;">
    Já tem conta? <a href="{{ url_for('login') }}" style="color: var(--accent); font-weight: 600;">Fazer login</a>
  </p>
</div>
{% endblock %}
