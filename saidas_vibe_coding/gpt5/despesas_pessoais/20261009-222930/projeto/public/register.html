<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Controle de Despesas</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page center-page">
    <section class="card auth-card">
      <h1>Criar conta</h1>
      <p class="subtitle">Cadastre-se para controlar suas despesas de qualquer computador ou celular.</p>

      <form id="registerForm">
        <label for="name">Nome</label>
        <input id="name" type="text" autocomplete="name" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required>

        <button type="submit">Criar conta</button>
      </form>

      <div id="message" class="message"></div>

      <p class="subtitle">
        Já tem conta?
        <a href="/login.html">Entrar</a>
      </p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
