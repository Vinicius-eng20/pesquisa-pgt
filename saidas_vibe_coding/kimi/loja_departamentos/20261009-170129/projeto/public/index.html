<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Virtual</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>🛍️ Loja Virtual</h1>
      <nav>
        <div id="menu-visitante">
          <button onclick="mostrarLogin()">Entrar</button>
          <button onclick="mostrarRegistro()">Criar Conta</button>
        </div>
        <div id="menu-usuario" style="display:none;">
          <span id="nome-usuario"></span>
          <button onclick="mostrarCarrinho()">🛒 Carrinho (<span id="qtd-carrinho">0</span>)</button>
          <button onclick="mostrarMeusPedidos()">Meus Pedidos</button>
          <button id="btn-admin" onclick="mostrarAdmin()" style="display:none;">⚙️ Administração</button>
          <button onclick="logout()">Sair</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Tela Inicial / Produtos -->
    <div id="tela-produtos" class="tela">
      <div class="filtros">
        <input type="text" id="busca" placeholder="Buscar produtos..." onkeyup="carregarProdutos()">
        <select id="filtro-categoria" onchange="carregarProdutos()">
          <option value="">Todas as categorias</option>
        </select>
      </div>
      <div id="lista-produtos" class="grid-produtos"></div>
    </div>

    <!-- Login -->
    <div id="tela-login" class="tela" style="display:none;">
      <div class="form-container">
        <h2>Entrar</h2>
        <form onsubmit="fazerLogin(event)">
          <input type="email" id="login-email" placeholder="Email" required>
          <input type="password" id="login-senha" placeholder="Senha" required>
          <button type="submit">Entrar</button>
          <p><a href="#" onclick="mostrarRegistro(); return false;">Não tem conta? Cadastre-se</a></p>
        </form>
      </div>
    </div>

    <!-- Registro -->
    <div id="tela-registro" class="tela" style="display:none;">
      <div class="form-container">
        <h2>Criar Conta</h2>
        <form onsubmit="fazerRegistro(event)">
          <input type="text" id="reg-nome" placeholder="Nome completo" required>
          <input type="email" id="reg-email" placeholder="Email" required>
          <input type="password" id="reg-senha" placeholder="Senha" required>
          <button type="submit">Cadastrar</button>
          <p><a href="#" onclick="mostrarLogin(); return false;">Já tem conta? Entre aqui</a></p>
        </form>
      </div>
    </div>

    <!-- Carrinho -->
    <div id="tela-carrinho" class="tela" style="display:none;">
      <h2>Meu Carrinho</h2>
      <div id="itens-carrinho"></div>
      <div id="carrinho-vazio" style="display:none;">
        <p>Seu carrinho está vazio</p>
        <button onclick="mostrarProdutos()">Continuar Comprando</button>
      </div>
      <div id="carrinho-com-itens" style="display:none;">
        <div class="total-carrinho">
          <h3>Total: R$ <span id="total-carrinho">0.00</span></h3>
        </div>
        <div class="form-container">
          <h3>Endereço de Entrega</h3>
          <textarea id="endereco" placeholder="Digite seu endereço completo" rows="3"></textarea>
          <button onclick="finalizarPedido()">Finalizar Pedido</button>
        </div>
      </div>
    </div>

    <!-- Meus Pedidos -->
    <div id="tela-meus-pedidos" class="tela" style="display:none;">
      <h2>Meus Pedidos</h2>
      <div id="lista-meus-pedidos"></div>
    </div>

    <!-- Administração -->
    <div id="tela-admin" class="tela" style="display:none;">
      <h2>Administração</h2>
      <div class="admin-tabs">
        <button onclick="mostrarAbaAdmin('produtos')" class="tab-btn active">Produtos</button>
        <button onclick="mostrarAbaAdmin('pedidos')" class="tab-btn">Pedidos</button>
      </div>

      <!-- Aba Produtos -->
      <div id="admin-produtos" class="admin-aba">
        <button onclick="mostrarFormProduto()" class="btn-novo">+ Novo Produto</button>
        <div id="form-produto" style="display:none;" class="form-container">
          <h3 id="titulo-form-produto">Novo Produto</h3>
          <form onsubmit="salvarProduto(event)">
            <input type="hidden" id="prod-id">
            <input type="text" id="prod-nome" placeholder="Nome do produto" required>
            <textarea id="prod-descricao" placeholder="Descrição" rows="3"></textarea>
            <input type="number" id="prod-preco" placeholder="Preço" step="0.01" required>
            <input type="text" id="prod-categoria" placeholder="Categoria">
            <input type="number" id="prod-estoque" placeholder="Estoque" required>
            <input type="text" id="prod-imagem" placeholder="URL da imagem (opcional)">
            <button type="submit">Salvar</button>
            <button type="button" onclick="cancelarFormProduto()">Cancelar</button>
          </form>
        </div>
        <div id="lista-admin-produtos"></div>
      </div>

      <!-- Aba Pedidos -->
      <div id="admin-pedidos" class="admin-aba" style="display:none;">
        <div id="lista-admin-pedidos"></div>
      </div>
    </div>

    <!-- Detalhes do Pedido -->
    <div id="tela-detalhes-pedido" class="tela" style="display:none;">
      <button onclick="voltarParaPedidos()">← Voltar</button>
      <div id="detalhes-pedido"></div>
    </div>
  </main>

  <div id="mensagem" class="mensagem"></div>

  <script src="app.js"></script>
</body>
</html>
