<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Tarefas da Equipe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">📋</div>
      <h1>Gestão de Tarefas</h1>
      <p class="auth-sub">Equipe e gerente em um só lugar</p>

      <div class="tabs">
        <button id="tab-login" class="tab active">Entrar</button>
        <button id="tab-registro" class="tab">Criar conta</button>
      </div>

      <!-- form login -->
      <form id="form-login" class="auth-form">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="voce@empresa.com" required autocomplete="email" />
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="Sua senha" required autocomplete="current-password" />
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p id="login-erro" class="auth-erro"></p>
        <p id="login-info" class="auth-info"></p>
      </form>

      <!-- form registro -->
      <form id="form-registro" class="auth-form hidden">
        <label>Nome</label>
        <input type="text" id="reg-nome" placeholder="Seu nome" required autocomplete="name" />
        <label>E-mail</label>
        <input type="email" id="reg-email" placeholder="voce@empresa.com" required autocomplete="email" />
        <label>Senha</label>
        <input type="password" id="reg-senha" placeholder="Crie uma senha (mín. 4)" required autocomplete="new-password" />
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
        <p id="reg-erro" class="auth-erro"></p>
        <p id="reg-info" class="auth-info"></p>
      </form>
    </div>
  </div>

  <!-- ================= APLICACAO ================= -->
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-ico">📋</span>
        <span class="brand-txt">Gestão de Tarefas</span>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <span class="user-nome" id="user-nome"></span>
          <span class="user-papel" id="user-papel"></span>
        </div>
        <button id="btn-logout" class="btn btn-ghost">Sair</button>
      </div>
    </header>

    <main class="container">
      <!-- barra de filtros / abas -->
      <div class="toolbar">
        <div class="filter-tabs" id="filter-tabs"></div>
        <div class="toolbar-right">
          <input type="search" id="busca" placeholder="Buscar tarefa..." />
          <button id="btn-nova" class="btn btn-primary">+ Nova tarefa</button>
        </div>
      </div>

      <div id="vazio" class="vazio hidden">
        <p id="vazio-txt">Nenhuma tarefa por aqui. Crie a primeira!</p>
      </div>

      <section id="lista" class="lista"></section>
    </main>
  </div>

  <!-- ================= MODAL: criar/editar tarefa ================= -->
  <div id="modal-tarefa" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-titulo">Nova tarefa</h2>
        <button class="modal-fechar" data-close>×</button>
      </div>

      <form id="form-tarefa" class="task-form">
        <label>Título</label>
        <input type="text" id="t-titulo" placeholder="O que precisa ser feito?" required />

        <label>Descrição (opcional)</label>
        <textarea id="t-descricao" rows="3" placeholder="Detalhes, instruções..."></textarea>

        <div class="linha-2">
          <div>
            <label>Prioridade</label>
            <select id="t-prioridade"></select>
          </div>
          <div>
            <label>Data de entrega</label>
            <input type="date" id="t-data" />
          </div>
        </div>

        <!-- visivel so para gerente -->
        <div id="bloco-atribuir" class="hidden">
          <label>Atribuir para</label>
          <div id="lista-atribuir" class="lista-atribuir"></div>
        </div>
        <input type="hidden" id="t-id" />
        <input type="hidden" id="t-status" />

        <div class="modal-acoes">
          <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
        <p id="t-erro" class="form-erro"></p>
      </form>
    </div>
  </div>

  <!-- ================= MODAL: detalhes ================= -->
  <div id="modal-detalhes" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Detalhes da tarefa</h2>
        <button class="modal-fechar" data-close>×</button>
      </div>
      <div id="detalhes-corpo"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
