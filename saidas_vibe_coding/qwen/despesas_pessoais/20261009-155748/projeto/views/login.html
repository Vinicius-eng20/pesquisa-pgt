<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Despesas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #e2e8f0; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { font-size: 28px; font-weight: 700; }
    .logo span { color: #4ade80; }
    .logo p { margin-top: 8px; color: #94a3b8; font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: 500; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 15px; margin-bottom: 18px; outline: none; }
    input:focus { border-color: #4ade80; }
    input::placeholder { color: #64748b; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #4ade80; color: #052e16; }
    .btn-primary:hover { background: #22c55e; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
    .tab.ativo { background: rgba(74,222,128,0.15); border-color: #4ade80; color: #4ade80; }
    .msg { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .msg.erro { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); display: block; }
    .msg.ok { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); display: block; }
    .divisor { text-align: center; margin: 20px 0; position: relative; }
    .divisor::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,0.1); }
    .divisor span { background: #1e293b; padding: 0 12px; position: relative; color: #64748b; font-size: 12px; }
    .admin-link { text-align: center; margin-top: 16px; }
    .admin-link a { color: #64748b; font-size: 12px; text-decoration: none; cursor: pointer; }
    .admin-link a:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>💰 Controle de <span>Despesas</span></h1>
      <p>Organize seus gastos e acompanhe seu mês</p>
    </div>

    <div class="tabs">
      <div class="tab ativo" id="tab-login">Entrar</div>
      <div class="tab" id="tab-cadastro">Criar conta</div>
    </div>

    <div class="msg" id="msg"></div>

    <!-- Login -->
    <form id="form-login">
      <label>Usuário</label>
      <input type="text" id="login-usuario" placeholder="seu-usuario" autocomplete="username" />
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••" autocomplete="current-password" />
      <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>
    </form>

    <!-- Cadastro -->
    <form id="form-cadastro" style="display:none">
      <label>Seu nome (opcional)</label>
      <input type="text" id="cad-nome" placeholder="Como quer ser chamado" />
      <label>Usuário</label>
      <input type="text" id="cad-usuario" placeholder="escolha um usuário" autocomplete="username" />
      <label>Senha</label>
      <input type="password" id="cad-senha" placeholder="mínimo 4 caracteres" autocomplete="new-password" />
      <button type="submit" class="btn btn-primary" id="btn-cadastro">Criar minha conta</button>
    </form>

    <div class="divisor"><span>acesso administrativo</span></div>
    <div class="admin-link">
      <a id="toggle-admin">Sou administrador</a>
    </div>
  </div>

  <script>
    let modoAdmin = false;
    const msgEl = document.getElementById("msg");
    function mostrarMsg(texto, tipo) {
      msgEl.textContent = texto;
      msgEl.className = "msg " + tipo;
      setTimeout(() => { msgEl.className = "msg"; }, 4000);
    }
    document.getElementById("tab-login").onclick = () => {
      document.getElementById("tab-login").classList.add("ativo");
      document.getElementById("tab-cadastro").classList.remove("ativo");
      document.getElementById("form-login").style.display = "";
      document.getElementById("form-cadastro").style.display = "none";
    };
    document.getElementById("tab-cadastro").onclick = () => {
      document.getElementById("tab-cadastro").classList.add("ativo");
      document.getElementById("tab-login").classList.remove("ativo");
      document.getElementById("form-cadastro").style.display = "";
      document.getElementById("form-login").style.display = "none";
    };
    document.getElementById("toggle-admin").onclick = () => {
      if (modoAdmin) {
        document.getElementById("login-usuario").value = "";
        document.getElementById("login-senha").value = "";
        document.getElementById("login-usuario").placeholder = "seu-usuario";
        document.getElementById("toggle-admin").textContent = "Sou administrador";
        modoAdmin = false;
      } else {
        document.getElementById("login-usuario").placeholder = "admin";
        document.getElementById("login-senha").focus();
        document.getElementById("toggle-admin").textContent = "Sou usuário comum";
        modoAdmin = true;
      }
      document.getElementById("tab-login").click();
    };
    document.getElementById("form-login").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      btn.disabled = true; btn.textContent = "Entrando...";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario: document.getElementById("login-usuario").value,
            senha: document.getElementById("login-senha").value
          })
        });
        const d = await r.json();
        if (d.erro) { mostrarMsg(d.erro, "erro"); return; }
        window.location.href = "/";
      } catch { mostrarMsg("Erro de conexão.", "erro"); }
      btn.disabled = false; btn.textContent = "Entrar";
    };
    document.getElementById("form-cadastro").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-cadastro");
      btn.disabled = true; btn.textContent = "Criando...";
      try {
        const r = await fetch("/api/registro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome: document.getElementById("cad-nome").value,
            usuario: document.getElementById("cad-usuario").value,
            senha: document.getElementById("cad-senha").value
          })
        });
        const d = await r.json();
        if (d.erro) { mostrarMsg(d.erro, "erro"); return; }
        window.location.href = "/";
      } catch { mostrarMsg("Erro de conexão.", "erro"); }
      btn.disabled = false; btn.textContent = "Criar minha conta";
    };
  </script>
</body>
</html>
