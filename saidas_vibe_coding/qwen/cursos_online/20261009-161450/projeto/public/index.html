<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursos Online — Plataforma</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar" id="topbar" style="display:none">
    <div class="brand">
      <span class="logo">📚</span>
      <span class="brand-name">Cursos Online</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-right">
      <span class="user-name" id="userName"></span>
      <button class="btn btn-ghost" id="logoutBtn">Sair</button>
    </div>
  </header>

  <main id="app" class="app">
    <!-- Tela de login / cadastro -->
    <section id="authView" class="auth-view">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="logo big">📚</span>
          <h1>Cursos Online</h1>
          <p>Entre com sua conta para acessar os cursos.</p>
        </div>

        <div class="auth-tabs">
          <button class="tab active" data-tab="login">Entrar</button>
          <button class="tab" data-tab="register">Criar conta</button>
        </div>

        <form id="authForm" class="auth-form">
          <div id="regNameWrap" style="display:none">
            <label for="name">Nome completo</label>
            <input type="text" id="name" placeholder="Seu nome" autocomplete="name" />
          </div>
          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" />
          </div>
          <div>
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Entrar</button>
          <p class="auth-msg" id="authMsg"></p>
        </form>

        <p class="admin-hint">
          Administrador: <strong>admin@plataforma.com</strong> / <strong>admin123</strong>
        </p>
      </div>
    </section>

    <!-- Conteúdo logado -->
    <section id="homeView" class="view" style="display:none">
      <div class="page-head">
        <h2 id="pageTitle">Cursos disponíveis</h2>
        <p id="pageSub"></p>
        <button class="btn btn-primary" id="newCourseBtn" style="display:none">+ Novo curso</button>
      </div>
      <div id="homeContent"></div>
    </section>

    <!-- Modal de cursos (criar/editar) -->
    <div class="modal-backdrop" id="courseModal" style="display:none">
      <div class="modal">
        <h3 id="courseModalTitle">Novo curso</h3>
        <form id="courseForm" class="modal-form">
          <input type="hidden" id="courseId" />
          <div>
            <label for="courseName">Nome do curso</label>
            <input type="text" id="courseName" required placeholder="Ex.: Lógica de Programação" />
          </div>
          <div>
            <label for="courseDesc">Descrição</label>
            <textarea id="courseDesc" rows="3" placeholder="Sobre o que é o curso?"></textarea>
          </div>
          <div class="row">
            <div>
              <label for="courseDuration">Duração</label>
              <input type="text" id="courseDuration" placeholder="Ex.: 40 horas" />
            </div>
            <div>
              <label for="coursePrice">Preço</label>
              <input type="text" id="coursePrice" placeholder="Ex.: R$ 0,00" />
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="courseCancel">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="courseSave">Salvar</button>
          </div>
          <p class="auth-msg" id="courseMsg"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
