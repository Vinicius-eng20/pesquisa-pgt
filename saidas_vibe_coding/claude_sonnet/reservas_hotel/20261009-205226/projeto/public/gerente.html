<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Gerente - Hotel Reservas</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h2>🏨 Hotel Reservas - Gerência</h2>
      <div class="nav-right">
        <span id="userName"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Sair</button>
      </div>
    </div>
  </nav>
  
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="quartos">Quartos</button>
      <button class="tab-btn" data-tab="reservas">Reservas</button>
    </div>
    
    <div id="quartosTab" class="tab-content active">
      <div class="card">
        <div class="card-header">
          <h2>Gerenciar Quartos</h2>
          <button id="addRoomBtn" class="btn btn-primary">+ Novo Quarto</button>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div id="roomsList"></div>
      </div>
    </div>
    
    <div id="reservasTab" class="tab-content">
      <div class="card">
        <h2>Todas as Reservas</h2>
        
        <div class="filter-group">
          <label>Filtrar por status:</label>
          <select id="statusFilter">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="confirmada">Confirmada</option>
            <option value="recusada">Recusada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        
        <div id="reservationsList"></div>
      </div>
    </div>
  </div>
  
  <div id="roomModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Adicionar Quarto</h2>
        <span class="close">&times;</span>
      </div>
      
      <form id="roomForm">
        <input type="hidden" id="roomId">
        
        <div class="form-group">
          <label for="numero">Número do Quarto</label>
          <input type="text" id="numero" name="numero" required>
        </div>
        
        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="Solteiro">Solteiro</option>
            <option value="Casal">Casal</option>
            <option value="Duplo">Duplo</option>
            <option value="Suíte">Suíte</option>
            <option value="Luxo">Luxo</option>
          </select>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="capacidade">Capacidade</label>
            <input type="number" id="capacidade" name="capacidade" min="1" required>
          </div>
          
          <div class="form-group">
            <label for="precoPorNoite">Preço por Noite (R$)</label>
            <input type="number" id="precoPorNoite" name="precoPorNoite" step="0.01" min="0" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" rows="3"></textarea>
        </div>
        
        <div class="form-group">
          <label for="comodidades">Comodidades (separadas por vírgula)</label>
          <input type="text" id="comodidades" name="comodidades" placeholder="Wi-Fi, TV, Ar-condicionado">
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="/gerente.js"></script>
</body>
</html>
