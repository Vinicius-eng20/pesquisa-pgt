<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Hóspede - Hotel Reservas</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h2>🏨 Hotel Reservas</h2>
      <div class="nav-right">
        <span id="userName"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Sair</button>
      </div>
    </div>
  </nav>
  
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="buscar">Buscar Quartos</button>
      <button class="tab-btn" data-tab="minhas">Minhas Reservas</button>
    </div>
    
    <div id="buscarTab" class="tab-content active">
      <div class="card">
        <h2>Buscar Quartos Disponíveis</h2>
        
        <form id="searchForm">
          <div class="form-row">
            <div class="form-group">
              <label for="dataInicio">Data de Entrada</label>
              <input type="date" id="dataInicio" name="dataInicio" required>
            </div>
            
            <div class="form-group">
              <label for="dataFim">Data de Saída</label>
              <input type="date" id="dataFim" name="dataFim" required>
            </div>
            
            <div class="form-group">
              <label>&nbsp;</label>
              <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
          </div>
        </form>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div id="roomsList"></div>
      </div>
    </div>
    
    <div id="minhasTab" class="tab-content">
      <div class="card">
        <h2>Minhas Reservas</h2>
        <div id="reservationsList"></div>
      </div>
    </div>
  </div>
  
  <script src="/hospede.js"></script>
</body>
</html>
