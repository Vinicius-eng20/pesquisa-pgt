<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Plataforma de Cursos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h2>Painel Administrativo</h2>
      <div class="nav-user">
        <span id="nomeUsuario"></span>
        <button id="btnLogout" class="btn btn-small">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="cursos">Gerenciar Cursos</button>
      <button class="tab-btn" data-tab="matriculas">Todas as Matrículas</button>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <div id="cursosTab" class="tab-content active">
      <div class="section-header">
        <h2>Gerenciar Cursos</h2>
        <button id="btnNovoCurso" class="btn btn-primary">+ Novo Curso</button>
      </div>

      <div id="formCurso" class="form-box" style="display: none;">
        <h3 id="formTitulo">Novo Curso</h3>
        <form id="cursoForm">
          <input type="hidden" id="cursoId">
          
          <div class="form-group">
            <label for="titulo">Título do Curso</label>
            <input type="text" id="titulo" required>
          </div>

          <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="4" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="instrutor">Instrutor</label>
              <input type="text" id="instrutor" required>
            </div>

            <div class="form-group">
              <label for="duracao">Duração</label>
              <input type="text" id="duracao" placeholder="Ex: 20 horas" required>
            </div>

            <div class="form-group">
              <label for="nivel">Nível</label>
              <select id="nivel" required>
                <option value="">Selecione</option>
                <option value="Iniciante">Iniciante</option>
                <option value="Intermediário">Intermediário</option>
                <option value="Avançado">Avançado</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
          </div>
        </form>
      </div>

      <div id="listaCursos" class="cursos-grid"></div>
    </div>

    <div id="matriculasTab" class="tab-content">
      <h2>Todas as Matrículas</h2>
      <div id="listaMatriculas"></div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
