<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace de Serviços Freelance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>🎯 Marketplace Freelance</h1>
      <p class="subtitle">Conectando profissionais e clientes</p>

      <div id="loginForm" class="form-section">
        <h2>Entrar</h2>
        <form id="loginFormElement">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p class="form-switch">
          Não tem conta? <a href="#" id="showRegister">Cadastre-se</a>
        </p>
      </div>

      <div id="registerForm" class="form-section" style="display: none;">
        <h2>Cadastrar</h2>
        <form id="registerFormElement">
          <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="registerName" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="registerEmail" required>
          </div>
          <div class="form-group">
            <label>Senha (mínimo 6 caracteres)</label>
            <input type="password" id="registerPassword" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
        <p class="form-switch">
          Já tem conta? <a href="#" id="showLogin">Entre aqui</a>
        </p>
      </div>

      <div id="errorMessage" class="error-message"></div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
