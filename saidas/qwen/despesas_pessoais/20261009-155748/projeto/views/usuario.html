<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Despesas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    header { background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
    header h1 { font-size: 18px; font-weight: 600; }
    header h1 span { color: #4ade80; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .user-name { color: #94a3b8; font-size: 14px; }
    .btn-sm { padding: 8px 16px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-sm:hover { background: rgba(255,255,255,0.1); }
    .btn-sm.logout { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .resumo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px; }
    .card .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .card .valor { font-size: 28px; font-weight: 700; }
    .card .valor.gasto { color: #f87171; }
    .card .valor.mes { color: #4ade80; }
    .card .valor.qtd { color: #60a5fa; }
    .secao { margin-bottom: 24px; }
    .secao-titulo { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .form-linha { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
    @media (max-width: 700px) { .form-linha { grid-template-columns: 1fr 1fr; } .form-linha .desc { grid-column: span 2; } }
    .form-campo label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-campo input, .form-campo select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 14px; outline: none; }
    .form-campo input:focus, .form-campo select:focus { border-color: #4ade80; }
    .btn-add { padding: 10px 20px; border: none; border-radius: 8px; background: #4ade80; color: #052e16; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; height: 42px; }
    .btn-add:hover { background: #22c55e; }
    .tabela-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: rgba(255,255,255,0.03); padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tr:last-child td { border-bottom: none; }
    .badge-cat { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .btn-del { background: none; border: none; color: #64748b; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 6px; transition: 0.2s; }
    .btn-del:hover { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .vazio { text-align: center; padding: 40px; color: #64748b; }
    .filtro-bar { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .filtro-bar select { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 13px; outline: none; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.aberto { display: flex; }
    .modal { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 28px; width: 90%; max-width: 380px; }
    .modal h3 { margin-bottom: 16px; font-size: 18px; }
    .modal label { display: block; margin-bottom: 4px; font-size: 13px; color: #94a3b8; }
    .modal input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 14px; margin-bottom: 14px; outline: none; }
    .modal input:focus { border-color: #4ade80; }
    .modal .btns { display: flex; gap: 10px; }
    .modal .btns button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal .btn-cancelar { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .modal .btn-salvar { background: #4ade80; color: #052e16; }
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 200; display: none; }
    .toast.ok { background: #065f46; color: #a7f3d0; border: 1px solid rgba(74,222,128,0.3); display: block; }
    .toast.erro { background: #7f1d1d; color: #fecaca; border: 1px solid rgba(239,68,68,0.3); display: block; }
    .mes-label { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>💰 Minhas <span>Despesas</span></h1>
    <div class="header-right">
      <span class="user-name" id="user-name"></span>
      <button class="btn-sm" id="btn-senha">Trocar senha</button>
      <button class="btn-sm logout" id="btn-sair">Sair</button>
    </div>
  </header>

  <main>
    <div class="resumo-grid">
      <div class="card">
        <div class="label">Gasto total</div>
        <div class="valor gasto" id="res-total">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Gasto no mês <span class="mes-label" id="mes-nome"></span></div>
        <div class="valor mes" id="res-mes">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Lançamentos</div>
        <div class="valor qtd" id="res-qtd">0</div>
      </div>
    </div>

    <div class="secao">
      <div class="secao-titulo">➕ Adicionar gasto</div>
      <div class="form-linha">
        <div class="form-campo desc">
          <label>Descrição</label>
          <input type="text" id="novo-desc" placeholder="Ex: Supermercado" />
        </div>
        <div class="form-campo">
          <label>Valor (R$)</label>
          <input type="number" id="novo-valor" min="0.01" step="0.01" placeholder="0,00" />
        </div>
        <div class="form-campo">
          <label>Data</label>
          <input type="date" id="novo-data" />
        </div>
        <div class="form-campo">
          <label>Categoria</label>
          <select id="novo-cat"></select>
        </div>
        <button class="btn-add" id="btn-add">Adicionar</button>
      </div>
    </div>

    <div class="secao">
      <div class="secao-titulo">📋 Meus lançamentos</div>
      <div class="filtro-bar">
        <select id="filtro-cat">
          <option value="">Todas as categorias</option>
        </select>
        <select id="filtro-mes">
          <option value="">Todos os meses</option>
        </select>
      </div>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th style="text-align:right">Valor</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="vazio" id="vazio" style="display:none">Nenhum gasto registrado ainda. Adicione seu primeiro acima! 🎉</div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-senha">
    <div class="modal">
      <h3>Trocar senha</h3>
      <label>Senha atual</label>
      <input type="password" id="senha-atual" placeholder="senha atual" />
      <label>Nova senha</label>
      <input type="password" id="senha-nova" placeholder="nova senha (mín 4 caracteres)" />
      <div class="btns">
        <button class="btn-cancelar" id="btn-cancelar-senha">Cancelar</button>
        <button class="btn-salvar" id="btn-salvar-senha">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let todasDespesas = [];
    let todasCategorias = [];
    const BRL = (v) => "R$ " + (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function toast(msg, tipo) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast " + tipo;
      setTimeout(() => { el.className = "toast"; }, 2500);
    }

    function mesNome(km) {
      const [ano, mes] = km.split("-").map(Number);
      const nomes = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
      return nomes[mes - 1] + " de " + ano;
    }

    async function carregar() {
      const [rResumo, rDesp, rCats] = await Promise.all([
        fetch("/api/meu-resumo").then(r => r.json()),
        fetch("/api/minhas-despesas").then(r => r.json()),
        fetch("/api/categorias").then(r => r.json())
      ]);
      document.getElementById("res-total").textContent = BRL(rResumo.totalGeral);
      document.getElementById("res-mes").textContent = BRL(rResumo.totalMesAtual);
      document.getElementById("res-qtd").textContent = rResumo.qtd;
      const agora = new Date();
      document.getElementById("mes-nome").textContent = mesNome(agora.getFullYear() + "-" + String(agora.getMonth() + 1).padStart(2, "0"));
      todasDespesas = rDesp.despesas;
      todasCategorias = rCats.categorias.filter(c => c.ativa);
      preencherCategorias();
      preencherFiltroMes();
      render();
    }

    function preencherCategorias() {
      const sel = document.getElementById("novo-cat");
      sel.innerHTML = '<option value="">Sem categoria</option>';
      todasCategorias.forEach(c => {
        sel.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
      });
      const filt = document.getElementById("filtro-cat");
      const atual = filt.value;
      filt.innerHTML = '<option value="">Todas as categorias</option>';
      todasCategorias.forEach(c => {
        filt.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
      });
      filt.value = atual;
    }

    function preencherFiltroMes() {
      const meses = {};
      todasDespesas.forEach(d => {
        const [ano, mes] = d.data.slice(0, 7).split("-").map(Number);
        const km = d.data.slice(0, 7);
        if (!meses[km]) meses[km] = mesNome(km);
      });
      const sel = document.getElementById("filtro-mes");
      const atual = sel.value;
      sel.innerHTML = '<option value="">Todos os meses</option>';
      Object.keys(meses).sort().reverse().forEach(km => {
        sel.innerHTML += `<option value="${km}">${meses[km]}</option>`;
      });
      sel.value = atual;
    }

    function render() {
      const fc = document.getElementById("filtro-cat").value;
      const fm = document.getElementById("filtro-mes").value;
      const lista = todasDespesas.filter(d => {
        if (fc && d.categoriaId !== fc) return false;
        if (fm && d.data.slice(0, 7) !== fm) return false;
        return true;
      });
      const tbody = document.getElementById("tbody");
      const vazio = document.getElementById("vazio");
      if (lista.length === 0) { tbody.innerHTML = ""; vazio.style.display = ""; return; }
      vazio.style.display = "none";
      tbody.innerHTML = lista.map(d => {
        const cor = d.categoria ? (d.categoria.cor || "#64748b") : "#64748b";
        const nomeCat = d.categoria ? d.categoria.nome : "Sem categoria";
        return `<tr>
          <td>${d.dataBR}</td>
          <td>${d.descricao.replace(/</g, "&lt;")}</td>
          <td><span class="badge-cat" style="background:${cor}33;color:${cor};border:1px solid ${cor}55">${nomeCat}</span></td>
          <td style="text-align:right;font-weight:600">${BRL(d.valor)}</td>
          <td style="text-align:right"><button class="btn-del" data-id="${d.id}" title="Apagar">🗑️</button></td>
        </tr>`;
      }).join("");
      tbody.querySelectorAll(".btn-del").forEach(b => {
        b.onclick = async () => {
          if (!confirm("Apagar este gasto?")) return;
          const r = await fetch("/api/despesas/" + b.dataset.id, { method: "DELETE" });
          const d = await r.json();
          if (d.erro) return toast(d.erro, "erro");
          toast("Gasto apagado.", "ok");
          carregar();
        };
      });
    }

    document.getElementById("filtro-cat").onchange = render;
    document.getElementById("filtro-mes").onchange = render;

    document.getElementById("btn-add").onclick = async () => {
      const desc = document.getElementById("novo-desc").value.trim();
      const valor = document.getElementById("novo-valor").value;
      const data = document.getElementById("novo-data").value;
      const cat = document.getElementById("novo-cat").value;
      if (!desc) return toast("Descreva o gasto.", "erro");
      if (!valor || parseFloat(valor) <= 0) return toast("Informe um valor válido.", "erro");
      const r = await fetch("/api/despesas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ descricao: desc, valor: parseFloat(valor), data: data || null, categoriaId: cat || null })
      });
      const d = await r.json();
      if (d.erro) return toast(d.erro, "erro");
      toast("Gasto adicionado! ✅", "ok");
      document.getElementById("novo-desc").value = "";
      document.getElementById("novo-valor").value = "";
      carregar();
    };

    document.getElementById("btn-sair").onclick = async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/";
    };

    document.getElementById("btn-senha").onclick = () => document.getElementById("modal-senha").classList.add("aberto");
    document.getElementById("btn-cancelar-senha").onclick = () => document.getElementById("modal-senha").classList.remove("aberto");
    document.getElementById("btn-salvar-senha").onclick = async () => {
      const r = await fetch("/api/senha", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ senhaAtual: document.getElementById("senha-atual").value, senhaNova: document.getElementById("senha-nova").value })
      });
      const d = await r.json();
      if (d.erro) return toast(d.erro, "erro");
      toast("Senha alterada! ✅", "ok");
      document.getElementById("modal-senha").classList.remove("aberto");
      document.getElementById("senha-atual").value = "";
      document.getElementById("senha-nova").value = "";
    };

    document.getElementById("novo-data").value = new Date().toISOString().slice(0, 10);
    fetch("/api/status").then(r => r.json()).then(d => {
      if (d.nome) document.getElementById("user-name").textContent = d.nome;
    });
    carregar();
  </script>
</body>
</html>
