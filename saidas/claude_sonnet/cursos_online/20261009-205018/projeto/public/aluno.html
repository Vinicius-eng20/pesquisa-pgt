<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Cursos - Plataforma de Cursos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h2>Plataforma de Cursos</h2>
      <div class="nav-user">
        <span id="nomeUsuario"></span>
        <button id="btnLogout" class="btn btn-small">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="cursos">Cursos Disponíveis</button>
      <button class="tab-btn" data-tab="matriculas">Meus Cursos</button>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <div id="cursosTab" class="tab-content active">
      <h2>Cursos Disponíveis</h2>
      <div id="listaCursos" class="cursos-grid"></div>
    </div>

    <div id="matriculasTab" class="tab-content">
      <h2>Meus Cursos</h2>
      <div id="listaMatriculas" class="cursos-grid"></div>
    </div>
  </div>

  <script src="/aluno.js"></script>
</body>
</html>
