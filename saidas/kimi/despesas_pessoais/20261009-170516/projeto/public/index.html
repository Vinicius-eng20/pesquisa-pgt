<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Controle de Despesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Login/Registro -->
        <div id="auth-screen" class="auth-container">
            <div class="auth-box">
                <h1>💰 Controle de Despesas</h1>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="mostrarLogin()">Login</button>
                    <button class="tab-btn" onclick="mostrarRegistro()">Registrar</button>
                </div>

                <!-- Formulário de Login -->
                <form id="login-form" class="auth-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-senha" placeholder="Senha" required>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>

                <!-- Formulário de Registro -->
                <form id="registro-form" class="auth-form" style="display:none;">
                    <input type="text" id="reg-nome" placeholder="Nome completo" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-senha" placeholder="Senha" required>
                    <label class="checkbox-label">
                        <input type="checkbox" id="reg-admin"> Administrador
                    </label>
                    <button type="submit" class="btn-primary">Criar Conta</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Principal -->
        <div id="dashboard" style="display:none;">
            <nav class="navbar">
                <h2>💰 Controle de Despesas</h2>
                <div class="user-info">
                    <span id="user-nome"></span>
                    <button onclick="logout()" class="btn-logout">Sair</button>
                </div>
            </nav>

            <div class="container">
                <!-- Menu de navegação -->
                <div class="menu-tabs">
                    <button class="menu-tab active" onclick="mostrarAba('despesas')">📝 Despesas</button>
                    <button class="menu-tab" onclick="mostrarAba('relatorio')">📊 Relatório</button>
                    <button class="menu-tab admin-only" onclick="mostrarAba('admin')" id="admin-tab">⚙️ Admin</button>
                </div>

                <!-- Aba de Despesas -->
                <div id="aba-despesas" class="aba-content">
                    <div class="card">
                        <h3>Nova Despesa</h3>
                        <form id="form-despesa">
                            <input type="text" id="desp-descricao" placeholder="Descrição" required>
                            <input type="number" id="desp-valor" placeholder="Valor (R$)" step="0.01" required>
                            <select id="desp-categoria" required></select>
                            <input type="date" id="desp-data" required>
                            <button type="submit" class="btn-primary">Adicionar</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3>Minhas Despesas</h3>
                        <div class="filtro-mes">
                            <input type="month" id="filtro-mes">
                            <button onclick="filtrarDespesas()" class="btn-secondary">Filtrar</button>
                            <button onclick="limparFiltro()" class="btn-secondary">Limpar</button>
                        </div>
                        <div id="lista-despesas"></div>
                    </div>
                </div>

                <!-- Aba de Relatório -->
                <div id="aba-relatorio" class="aba-content" style="display:none;">
                    <div class="card">
                        <h3>Relatório Mensal</h3>
                        <input type="month" id="relatorio-mes" onchange="gerarRelatorio()">
                        <div id="relatorio-content"></div>
                    </div>
                </div>

                <!-- Aba Admin -->
                <div id="aba-admin" class="aba-content" style="display:none;">
                    <div class="card">
                        <h3>Gerenciar Categorias</h3>
                        <form id="form-categoria">
                            <input type="text" id="cat-nome" placeholder="Nome da categoria" required>
                            <input type="color" id="cat-cor" value="#007bff">
                            <button type="submit" class="btn-primary">Adicionar</button>
                        </form>
                        <div id="lista-categorias"></div>
                    </div>

                    <div class="card">
                        <h3>Gerenciar Usuários</h3>
                        <div id="lista-usuarios"></div>
                    </div>

                    <div class="card">
                        <h3>Estatísticas Gerais</h3>
                        <input type="month" id="admin-mes" onchange="carregarEstatisticas()">
                        <div id="estatisticas"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
