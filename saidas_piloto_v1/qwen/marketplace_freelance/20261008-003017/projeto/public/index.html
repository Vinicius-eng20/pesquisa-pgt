<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace de Serviços Freelance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
</head>
<body>
  <div id="bg-grid" aria-hidden="true"></div>
  <div id="bg-dots" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" data-nav="/">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h18l-1.5 12.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5L3 7z"/>
            <path d="M8 7V5a4 4 0 0 1 8 0v2"/>
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">Oferta<span class="brand__accent">Livre</span></span>
          <span class="brand__sub">marketplace freelance</span>
        </span>
      </a>

      <nav class="main-nav" id="mainNav" aria-label="Navegação principal">
        <!-- Links preenchidos pelo JS conforme usuário / admin -->
      </nav>

      <div class="topbar__right">
        <div id="userBox" class="userbox" hidden></div>
        <button id="btnAuthTop" class="btn btn--primary" hidden>Entrar</button>
      </div>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__brand">OfertaLivre · marketplace de serviços freelance</p>
      <p class="footer__meta">
        <span>Tudo salvo localmente no próprio site.</span>
        <span class="footer__dot">·</span>
        <span id="footerStats"></span>
      </p>
    </div>
  </footer>

  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
