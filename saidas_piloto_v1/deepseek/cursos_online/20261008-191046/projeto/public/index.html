<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Cursos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎓 Plataforma de Cursos</h1>
  <div id="userArea"></div>
</header>

<main>
  <section id="authView" class="view">
    <div class="tabs">
      <button class="tab active" data-tab="login">Entrar</button>
      <button class="tab" data-tab="register">Criar Conta</button>
    </div>
    <form id="loginForm" class="form">
      <h2>Entrar</h2>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginSenha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <p class="hint">Admin padrão: admin@admin.com / admin123</p>
    </form>
    <form id="registerForm" class="form hidden">
      <h2>Criar Conta</h2>
      <input type="text" id="regNome" placeholder="Nome completo" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regSenha" placeholder="Senha (mín 4 caracteres)" required>
      <button type="submit">Cadastrar</button>
    </form>
    <div id="authMsg" class="msg"></div>
  </section>

  <section id="alunoView" class="view hidden">
    <div class="tabs">
      <button class="tab active" data-atab="disponiveis">Cursos Disponíveis</button>
      <button class="tab" data-atab="matriculados">Meus Cursos</button>
    </div>
    <div id="cursosDisponiveis" class="grid"></div>
    <div id="cursosMatriculados" class="grid hidden"></div>
  </section>

  <section id="adminView" class="view hidden">
    <div class="tabs">
      <button class="tab active" data-admin="cursos">Gerenciar Cursos</button>
      <button class="tab" data-admin="matriculas">Todas as Matrículas</button>
    </div>
    <div id="adminCursos">
      <form id="cursoForm" class="form">
        <h3 id="cursoFormTitle">Novo Curso</h3>
        <input type="hidden" id="cursoId">
        <input type="text" id="cursoTitulo" placeholder="Título" required>
        <textarea id="cursoDescricao" placeholder="Descrição" required></textarea>
        <input type="text" id="cursoInstrutor" placeholder="Instrutor" required>
        <input type="number" id="cursoCarga" placeholder="Carga horária (horas)" required>
        <input type="number" step="0.01" id="cursoPreco" placeholder="Preço (R$)" required>
        <div class="form-actions">
          <button type="submit">Salvar</button>
          <button type="button" id="cancelCurso" class="btn-secondary hidden">Cancelar</button>
        </div>
      </form>
      <div id="listaCursosAdmin" class="grid"></div>
    </div>
    <div id="adminMatriculas" class="hidden">
      <div id="listaMatriculas" class="grid"></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
