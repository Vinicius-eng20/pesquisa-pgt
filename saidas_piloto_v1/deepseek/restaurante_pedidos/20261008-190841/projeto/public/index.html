<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante - Sistema de Pedidos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍽️ Restaurante</h1>
  <div id="userArea"></div>
</header>

<div id="authScreen" class="screen">
  <div class="card">
    <h2>Entrar</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginSenha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p class="hint">Gerente padrão: gerente@restaurante.com / admin123</p>
    <hr>
    <h3>Criar conta (cliente)</h3>
    <input type="text" id="cadNome" placeholder="Nome">
    <input type="email" id="cadEmail" placeholder="Email">
    <input type="password" id="cadSenha" placeholder="Senha">
    <button onclick="cadastrar()">Cadastrar</button>
    <p id="authMsg" class="msg"></p>
  </div>
</div>

<div id="clienteScreen" class="screen hidden">
  <nav class="tabs">
    <button onclick="mostrarTab('cardapio')" class="tab-active" data-tab="cardapio">Cardápio</button>
    <button onclick="mostrarTab('carrinho')" data-tab="carrinho">Carrinho (<span id="cartCount">0</span>)</button>
    <button onclick="mostrarTab('meusPedidos')" data-tab="meusPedidos">Meus Pedidos</button>
  </nav>

  <section id="tab-cardapio" class="tab-content">
    <h2>Cardápio</h2>
    <div id="listaPratos" class="grid"></div>
  </section>

  <section id="tab-carrinho" class="tab-content hidden">
    <h2>Seu Carrinho</h2>
    <div id="carrinhoItens"></div>
    <div id="carrinhoTotal"></div>
    <button id="btnFinalizar" onclick="finalizarPedido()" class="primary">Finalizar Pedido</button>
  </section>

  <section id="tab-meusPedidos" class="tab-content hidden">
    <h2>Meus Pedidos</h2>
    <div id="meusPedidos"></div>
  </section>
</div>

<div id="gerenteScreen" class="screen hidden">
  <nav class="tabs">
    <button onclick="mostrarTabG('pedidos')" class="tab-active" data-tab="pedidos">Todos os Pedidos</button>
    <button onclick="mostrarTabG('cardapioG')" data-tab="cardapioG">Gerenciar Cardápio</button>
  </nav>

  <section id="tab-pedidos" class="tab-content">
    <h2>Pedidos dos Clientes</h2>
    <div id="todosPedidos"></div>
  </section>

  <section id="tab-cardapioG" class="tab-content hidden">
    <h2>Gerenciar Cardápio</h2>
    <div class="card">
      <h3 id="formTitulo">Adicionar Prato</h3>
      <input type="hidden" id="pratoId">
      <input type="text" id="pratoNome" placeholder="Nome do prato">
      <input type="text" id="pratoDescricao" placeholder="Descrição">
      <input type="number" step="0.01" id="pratoPreco" placeholder="Preço">
      <select id="pratoCategoria">
        <option>Entrada</option>
        <option>Principal</option>
        <option>Sobremesa</option>
        <option>Bebida</option>
      </select>
      <label><input type="checkbox" id="pratoDisponivel" checked> Disponível</label>
      <button onclick="salvarPrato()" class="primary">Salvar</button>
      <button onclick="limparFormPrato()">Cancelar</button>
    </div>
    <div id="listaPratosG" class="grid"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
